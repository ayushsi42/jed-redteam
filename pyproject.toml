[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jed-redteam"
version = "0.1.0"
description = "Adversarial search algorithm for finding security failures in guardrailed, tool-using LLM agents"
requires-python = ">=3.11"
dependencies = [
    "aicomp-sdk==3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
