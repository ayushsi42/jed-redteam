[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jed-redteam"
version = "0.1.0"
description = "Attack-search development package for the Kaggle AI Agent Security (JED) red-team competition"
requires-python = ">=3.11"
dependencies = [
    "aicomp-sdk==3.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
